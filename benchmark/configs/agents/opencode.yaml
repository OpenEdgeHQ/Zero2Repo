# Harbor job config: run zero2repo tasks with the OpenCode agent.
#
# Uses CodingBenchOpenCode (image-baked opencode + npm fallback; no nvm/GitHub).
# With the `openai` provider it reads OPENAI_API_KEY and OPENAI_BASE_URL, so it
# plugs into any OpenAI-compatible endpoint. Bring your own credentials; set
# OPENAI_BASE_URL if you use a gateway/proxy.
#
# Run from the benchmark/ directory after building tasks:
#   python -m coding_bench_harbor.run_adapter --all --force
#   OPENAI_API_KEY=... harbor run --config configs/agents/opencode.yaml
jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 1
environment:
  type: docker
  force_build: true
  delete: true
  env:
    - OPENAI_API_KEY=${OPENAI_API_KEY}
    - OPENAI_BASE_URL=${OPENAI_BASE_URL}
agents:
  - import_path: coding_bench_harbor.agents.opencode:CodingBenchOpenCode
    model_name: openai/gpt-5.1-codex
datasets:
  - path: output
